spring.application.name=ms-resultados
server.port=8082

# PostgreSQL. Se puede cambiar con variables de entorno DB_URL, DB_USER y DB_PASSWORD
# (por ejemplo, para usar una base en la nube como Neon).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mpaz_resultados}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
